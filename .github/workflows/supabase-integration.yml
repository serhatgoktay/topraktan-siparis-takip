name: Isolated Supabase integration
on:
  push:
    branches: [feature/order-revisions-production]
    paths:
      - '.github/workflows/supabase-integration.yml'
      - 'scripts/check-real-supabase.mjs'
      - 'scripts/build-production-update.mjs'
      - 'supabase/releases/**'
      - 'tests/**'
      - 'supabase/migrations/**'
      - 'supabase-server.js'
      - 'api/**'
      - 'reports.js'
      - 'public/**'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-supabase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No hosted Supabase URL, token or project secret is used.
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
      - name: Configure disposable local project
        run: |
          supabase init
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/config.toml')
          s=p.read_text()
          import re
          s=re.sub(r'^project_id = .*$', 'project_id = "topraktan-ci"', s, flags=re.M)
          p.write_text(s)
          PY
      - name: Start real PostgreSQL, Auth and PostgREST
        run: |
          supabase start -x studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector,supavisor
          umask 077
          supabase status -o json > "$RUNNER_TEMP/topraktan-local-status.json"
      - name: Run application against isolated Supabase
        env:
          LOCAL_SUPABASE_STATUS_FILE: ${{ runner.temp }}/topraktan-local-status.json
          TEST_SUMMARY_FILE: ${{ runner.temp }}/topraktan-integration-result.json
        run: npm run test:supabase
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: isolated-supabase-test-result
          path: ${{ runner.temp }}/topraktan-integration-result.json
          retention-days: 7
      - name: Stop only disposable local project
        if: always()
        run: |
          if [ -f supabase/config.toml ]; then
            supabase stop --no-backup || true
          fi
